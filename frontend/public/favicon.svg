<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow-magenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark circular background with subtle border -->
  <rect width="64" height="64" rx="14" fill="#0b0e1b"/>
  
  <!-- Stand / base -->
  <path d="M20 54 L26 43 L38 43 L44 54 Z" stroke="#ff2a8d" stroke-width="3" stroke-linejoin="round" fill="none" filter="url(#glow-magenta)"/>
  
  <!-- Outer Wheel Ring -->
  <circle cx="32" cy="28" r="21" stroke="#ff2a8d" stroke-width="3.5" filter="url(#glow-magenta)"/>
  <circle cx="32" cy="28" r="17" stroke="#e879f9" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Center Hub -->
  <circle cx="32" cy="28" r="4.2" stroke="#00f0ff" stroke-width="2.2" fill="#0b0e1b" filter="url(#glow-cyan)"/>
  
  <!-- Spokes -->
  <line x1="32" y1="11" x2="32" y2="23.8" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow-cyan)"/>
  <line x1="32" y1="32.2" x2="32" y2="45" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow-cyan)"/>
  <line x1="15" y1="28" x2="27.8" y2="28" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow-cyan)"/>
  <line x1="36.2" y1="28" x2="49" y2="28" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow-cyan)"/>
  
  <!-- Lottery Balls inside -->
  <circle cx="24" cy="20" r="2.4" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="40" cy="21" r="2.4" fill="#f43f5e" stroke="#e11d48" stroke-width="1"/>
  <circle cx="23" cy="35" r="2.4" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="41" cy="36" r="2.4" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
</svg>